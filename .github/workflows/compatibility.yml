name: Frontend compatibility
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test scripts/*.test.cjs
      - run: npm audit --audit-level=high
      - run: npx expo export --platform android --output-dir dist-production
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
      - run: npx expo export --platform ios --output-dir dist-production-ios
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
